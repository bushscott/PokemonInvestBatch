name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    # Matches the Pi's PostgreSQL 15, because the tests assert on SQL the
    # Npgsql provider generates — a version drift here would pass in CI and
    # fail in production, which is the one failure a test suite must not have.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Only a template: each test creates and drops a database of its own
      # beside this one. The superuser is used because the tests need CREATEDB,
      # exactly as pokemon_tester does on the Pi.
      POKEMON_TEST_DB: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"

    # Actions are pinned to commit SHAs, not tags: a tag is a mutable pointer
    # the action's owner can silently repoint, which is how the trivy-action
    # and kics-github-action compromises reached their consumers. The trailing
    # comment is the human-readable version — bump both together.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore PokemonInvestBatch.slnx

      # Directory.Build.props sets TreatWarningsAsErrors, so any new warning
      # fails the build here rather than accumulating unnoticed.
      - name: Build
        run: dotnet build PokemonInvestBatch.slnx --no-restore -c Release

      # Every test runs here, including the ones that need real PostgreSQL:
      # each builds its own database against the service container above and
      # drops it again. Nothing is skipped, so a green tick means green.
      - name: Test
        run: dotnet test PokemonInvestBatch.slnx --no-build -c Release

      # EF scaffolds its migrations with a byte-order mark that the shared
      # .editorconfig rejects, so generated code is excluded rather than
      # hand-edited after every scaffold.
      - name: Verify formatting
        run: dotnet format PokemonInvestBatch.slnx --verify-no-changes --severity error --exclude '**/Migrations/**'
